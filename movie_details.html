<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/show_details.css">
    <title>Movie Details</title>
</head>

<body>
    <div class="movie-details-container">
        <img id="movie-poster" src="" alt="Movie Poster">
        <div class="movie-details-info">
            <h2 id="movie-title"></h2>
            <p><strong>Rating:</strong> <span id="movie-rating"></span></p>
            <p><strong>Genre:</strong> <span id="movie-genre"></span></p>
            <p><strong>Duration:</strong> <span id="movie-duration"></span></p>
            <p><strong>Release Date:</strong> <span id="movie-release-date"></span></p>
            <p><strong>Cast:</strong> <span id="movie-cast"></span></p>
            <p><strong>Storyline:</strong> <span id="movie-storyline"></span></p>
            <a href="" id="rem-fav-btn">Remove From Favorites</a>
        </div>
    </div>
    <script src="script/show_details.js"></script>
</body>

</html>
